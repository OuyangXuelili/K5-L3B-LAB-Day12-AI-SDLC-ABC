<style>

</head><body>
<header><div><h1>ÚT SEN <span class="badge">/ CHỢ NỔI</span></h1><small id="phase">Một ngày miền Tây</small></div><button id="contrast" type="button" aria-pressed="false">Tương phản cao: Tắt</button><div class="stats" id="stats"></div></header>
<div id="stage"><canvas id="c" aria-label="Bản đồ chợ nổi"></canvas></div>

<script>
"use strict";
const cv=document.querySelector('#c'),ctx=cv.getContext('2d'),side=document.querySelector('#sidebar');
const names={ca_loc:'Cá lóc',ca_linh:'Cá linh',ca_keo:'Cá kèo',bong_dien_dien:'Bông điên điển',bong_sung:'Bông súng',keo_neo:'Kèo nèo'};
const dishes={ca_loc_nuong_trui:'Cá lóc nướng trui',goi_bong_sung:'Gỏi bông súng',lau_ca_linh_dien_dien:'Lẩu cá linh điên điển',canh_chua_ca_loc:'Canh chua cá lóc',ca_keo_nuong:'Cá kèo nướng',lau_mam:'Lẩu mắm'};
const colors={ca_loc:'#a9b96b',ca_linh:'#c0e4df',ca_keo:'#dfaa75',bong_dien_dien:'#edc94e',bong_sung:'#e99eb7',keo_neo:'#8dc981'};
const $=s=>document.querySelector(s), label=d=>dishes[d]||d;
let snap=null,down=new Set(),queue=[],sending=false,lastInput='',modalKey='',offline=false,exited=false,frames=0,fps=0,lastFps=performance.now();
let highContrast=false;
try{highContrast=localStorage.getItem('chonoi.highContrast')==='true'}catch{}
function applyContrast(){document.body.classList.toggle('high-contrast',highContrast);$('#contrast').setAttribute('aria-pressed',String(highContrast));$('#contrast').textContent='Tương phản cao: '+(highContrast?'Bật':'Tắt');try{localStorage.setItem('chonoi.highContrast',String(highContrast))}catch{}}
$('#contrast').onclick=()=>{highContrast=!highContrast;applyContrast()};applyContrast();
function warnings(){const alerts=$('#alerts'),messages=[];
 if(snap.phase==='gather'&&snap.player){const p=snap.player;
 if(snap.monsters?.some(m=>Math.hypot(p.pos[0]-m.pos[0],p.pos[1]-m.pos[1])<=16))messages.push(['monster-warning','⚠ Thủy quái gần! Bơi lên vùng nông.']);
 if(p.oxygen_ticks<p.oxygen_max_ticks*.25)messages.push(['oxygen-warning',p.oxygen_ticks===0?'⚠ Hết hơi! Nổi lên ngay.':'⚠ Oxy sắp hết! Nổi lên để thở.']);
 }else if(snap.phase==='quan'){for(const c of snap.customers||[])if(c.state==='waiting'&&c.patience_ticks_left<snap.meta.patience_s*60*.25)messages.push(['customer-warning',`⚠ ${c.table_id}: Khách sắp giận!`]);}
 const signature=JSON.stringify(messages);if(alerts.dataset.messages===signature)return;alerts.dataset.messages=signature;alerts.replaceChildren();for(const [cls,text] of messages)el('span',text,cls,alerts);
}
const moveKeys={w:'u',arrowup:'u',s:'d',arrowdown:'d',a:'l',arrowleft:'l',d:'r',arrowright:'r'};
const time=t=>Math.floor(Math.ceil(t/60)/60)+':'+String(Math.ceil(t/60)%60).padStart(2,'0');
function el(tag,text,cls,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;if(parent)parent.append(n);return n}
async function send(body){queue.push(body);if(sending)return;sending=true;while(queue.length){try{await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(queue.shift())})}catch{offline=true}}sending=false}
function tap(key){send({[key]:true});send({[key]:false})}
function input(){const phase=snap?.phase||'gather';let y=(down.has('d')?1:0)-(down.has('u')?1:0);if(phase==='quan')y=-y;const b={move:[(down.has('r')?1:0)-(down.has('l')?1:0),y],interact:down.has('interact'),catch:down.has('catch')};const str=JSON.stringify(b);if(str!==lastInput){lastInput=str;send(b)}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','escape','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(e.repeat)return;if(k==='r'){fetch('/restart',{method:'POST'});exited=false;down.clear();lastInput='';return}if(snap?.screen){if(!['Menu','Summary'].includes(snap.screen))send({continue:true});return}if(k==='p'||k==='escape'){tap('pause');return}if(snap?.state==='paused')return;if(moveKeys[k])down.add(moveKeys[k]);if(k==='e')down.add('interact');if(k===' ')down.add('catch');input()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(moveKeys[k])down.delete(moveKeys[k]);if(k==='e')down.delete('interact');if(k===' ')down.delete('catch');input()});
addEventListener('blur',()=>{down.clear();input()});
function button(text,action,parent,secondary=false){const b=el('button',text,secondary?'secondary':'',parent);b.onclick=action;return b}
function stockCounts(stock){
  if(!Array.isArray(stock)) return stock||{};
  const counts={};
  for(const item of stock) counts[item.kind]=(counts[item.kind]||0)+1;
  return counts;
}
function stockText(stock){return Object.entries(stockCounts(stock)).filter(([,n])=>n>0).map(([k,n])=>`${names[k]||k} ×${n}`).join(' · ')||'Trống'}
function listIndividuals(parent,items){
  const cutoff=snap.freshness.spoiled_below;
  for(const item of items){
    const spoiled=item.fresh<cutoff;
    const row=el('div',undefined,spoiled?'row danger':'row',parent);
    el('div',`${names[item.kind]||item.kind} · ${item.id}`,null,row);
    const percentage=Math.floor(item.fresh*100)/100;
    el('div',spoiled?`Ươn · ${percentage}% độ tươi`:`${percentage}% độ tươi`,spoiled?null:'muted',row);
  }
}
function listStock(parent,stock){for(const [k,n] of Object.entries(stock||{}))el('div',`${names[k]||k} ×${n}`,'row',parent)}
function showModal(){const screen=exited?'Exit':snap.screen|| (snap.state==='paused'?'Pause':snap.phase==='shop'?'Shop':snap.finished?'Summary':'');const key=JSON.stringify([screen,screen==='Shop'?Math.ceil(snap.time_left_ticks/60):0,snap.day,snap.money,snap.upgrades,snap.active_upgrades,snap.day_results,snap.events?.slice(-1)]);if(modalKey===key)return;modalKey=key;const modal=$('#modal'),card=$('#card');modal.style.display=screen?'flex':'none';card.replaceChildren();if(!screen)return;
 const actions=()=>el('div',undefined,'actions',card);
 if(screen==='Menu'||screen==='Exit'){el('p','MỘT NGÀY Ở MIỀN TÂY','muted',card);el('h2','Quán ăn chợ nổi',null,card);el('p',screen==='Exit'?'Đã rời lượt chơi. Bạn có thể đóng tab hoặc bắt đầu lại.':'Sáng lặn bắt cá, hái rau. Tối nấu và phục vụ khách. Cuối ngày dành tiền nâng cấp cho chuyến lặn tiếp theo.',null,card);const a=actions();button('Chơi',()=>{exited=false;send({continue:true})},a);button('Thoát',()=>{exited=true;modalKey='';showModal()},a,true)}
 else if(screen==='Pause'){el('h2','Tạm dừng',null,card);el('p','Đồng hồ, khách, bếp, oxy và Shop đều đang dừng.',null,card);const a=actions();button('Tiếp tục',()=>tap('pause'),a);button('Về menu',()=>send({menu:true}),a,true)}
 else if(screen==='DayIntro'){el('p',`NGÀY ${snap.day} · MÁ TƯ DẶN`,'muted',card);el('h2','Hôm nay mình nấu gì?',null,card);for(const [d,n] of Object.entries(snap.day_plan.dishes))el('div',`${label(d)} ×${n}`,'row',card);el('h3','Nguyên liệu cần lấy',null,card);listStock(card,snap.day_plan.ingredients);el('p','Tự bắt đầu sau 4 giây, hoặc nhấn một phím.','muted',card);button('Xuống nước',()=>send({continue:true}),actions())}
 else if(screen==='EveningIntro'){el('h2','Về bến, mở quán!',null,card);el('p','Kho vừa mang về: '+stockText(snap.stock),null,card);el('h3','Món có thể nấu',null,card);let count=0;for(const d of Object.keys(snap.day_plan.dishes)){if(Object.entries(snap.catalog[d].recipe).every(([k,n])=>((snap.available_stock||stockCounts(snap.stock))[k]||0)>=n)){el('div',label(d),'row',card);count++}}if(!count)el('p','Kho chưa đủ nguyên liệu cho món trong kế hoạch.',null,card);button('Mở ca tối',()=>send({continue:true}),actions())}
 else if(screen==='DayResult'){const r=snap.day_results.at(-1);el('h2',`Kết quả ngày ${snap.day}`,null,card);el('p',`Phục vụ ${r.served} khách · bỏ đi ${r.left} khách`,null,card);el('div',`Thu ca ${r.shift_earned}k · trong đó boa ${r.tips}k`,'row',card);el('div',`Thay đổi uy tín ${r.reputation_delta>=0?'+':''}${r.reputation_delta.toFixed(1)}`,'row',card);button('Ghé Shop',()=>send({continue:true}),actions())}
 else if(screen==='Shop'){el('p',`CÒN ${time(snap.time_left_ticks)} · TIỀN ${snap.money}k`,'muted',card);el('h2','Chuẩn bị chuyến lặn sau',null,card);el('p','Nâng cấp áp dụng từ ngày kế tiếp. Điểm dựa trên tổng thu và uy tín.',null,card);for(const [kind,levels]of Object.entries(snap.shop_catalog.upgrades)){const level=snap.upgrades[kind]||0,next=levels[level],title=kind==='hp'?'Áo phao':'Bình oxy';const row=el('div',`${title} · cấp đã mua ${level} · đang dùng ${snap.active_upgrades[kind]||0}`,'row',card);if(next){const benefit=kind==='hp'?`${next.hp_max} máu`:`${next.oxygen_max_s}s oxy`;button(`${next.price}k → ${benefit}`,()=>send({buy:kind}),row)}else el('div','Đã nâng tối đa','muted',row)}const ev=snap.events?.at(-1);if(ev?.name==='buy_failed')el('p',{funds:'Chưa đủ tiền.',max_level:'Đã đạt cấp tối đa.',unknown:'Nâng cấp không hỗ trợ.'}[ev.data.reason]||ev.data.reason,'danger',card);el('p','Kho dư: '+stockText(snap.stock)+'. Kho này sẽ bỏ khi rời Shop.','muted',card);button('Xong',()=>tap('shop_done'),actions())}
 else {el('h2','Khép lại một ngày chợ nổi',null,card);el('p',`Hoàn thành ${snap.days_completed||0} ngày · tiền còn ${snap.money}k · tổng thu ${snap.earned}k`,null,card);el('div',`Uy tín ${snap.reputation.toFixed(1)} · điểm ${snap.score}`,'row',card);const best=Object.entries(snap.sold||{}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];el('p','Món bán chạy: '+(best?`${label(best[0])} ×${best[1]}`:'Chưa có món bán'),null,card);button('Về menu',()=>send({menu:true}),actions())}}
function hud(){const g=snap.phase==='gather',p=snap.player,stats=$('#stats');$('#phase').textContent=`${snap.day?'Ngày '+snap.day+' · ':''}${g?'Lặn & hái':snap.phase==='quan'?'Mở quán':'Shop'}`;stats.replaceChildren();el('span',`◷ ${time(snap.time_left_ticks)}`,snap.time_left_ticks<=1800?'danger':'',stats);if(g&&p){el('span',`Máu ${p.hp}/${p.hp_max}`,p.hp<=1?'danger':'',stats);const span=el('span',`Oxy ${Math.ceil(p.oxygen_ticks/60)}s `,p.oxygen_ticks<p.oxygen_max_ticks*.25?'danger':'',stats);const meter=el('meter',undefined,null,span);meter.min=0;meter.max=p.oxygen_max_ticks;meter.value=p.oxygen_ticks}else el('span',`Tiền ca ${snap.shift_earned||0}k · tiền ${snap.money}k · uy tín ${snap.reputation.toFixed(1)}`,null,stats);
 side.replaceChildren();if(g){el('h2','Giỏ nguyên liệu',null,side);el('div',`${snap.hold_count}/${snap.hold_capacity} ô · sâu ${p.pos[1].toFixed(1)}m`,'muted',side);const counts=stockCounts(snap.hold);if(snap.freshness)listIndividuals(side,snap.hold);else listStock(side,counts);if(!snap.hold.length)el('p','Giỏ đang trống.','muted',side);if(snap.day_plan){el('h3','Đã lấy / cần',null,side);for(const [k,n]of Object.entries(snap.day_plan.ingredients))el('div',`${names[k]} ${counts[k]||0}/${n}`,(counts[k]||0)>=n?'row good':'row',side)}el('h3','Hồi bắt',null,side);el('p',snap.player.catch_cd_ticks?`${(snap.player.catch_cd_ticks/60).toFixed(1)}s`:'Sẵn sàng',null,side)}
 else if(snap.phase==='quan'){el('h2','Đơn đang chờ',null,side);for(const c of snap.customers){const row=el('div',`${c.table_id} · ${label(c.dish_id)}`,'row',side);el('div',c.state==='eating'?'Đang ăn':`${Math.ceil(c.patience_ticks_left/60)}s · ${c.order_status==='reserved'?'chờ nấu':'đã nấu'}`,c.patience_ticks_left<900?'danger':'muted',row)}el('h3','Đang cầm',null,side);el('p',snap.hand?label(snap.hand.dish_id)+(snap.hand.base_price===undefined?'':` · ${snap.hand.base_price}k`):'Tay trống',null,side);el('h3','Kho khả dụng',null,side);listStock(side,snap.available_stock);el('h3','Tổng kho',null,side);if(snap.freshness)listIndividuals(side,snap.stock);else el('p',stockText(snap.stock),'muted',side);if(!snap.stock.length && snap.freshness)el('p','Kho đang trống.','muted',side)}
 let hint='';if(g){const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);if(snap.monsters?.some(m=>dist(p.pos,m.pos)<=16))hint='Thủy quái! Bơi lên vùng nước nông.';else if(p.oxygen_ticks===0)hint='Hết hơi! Nổi lên mặt nước ngay.';else if(dist(p.pos,snap.meta.dock_pos)<=snap.meta.dock_radius)hint='E · Cập bến và mở quán';else if(p.at_surface&&snap.nodes.some(n=>n.ready&&dist(p.pos,n.pos)<=snap.meta.interact_radius))hint='E · Hái rau gần nhất';else hint='Space · Bắt cá dưới nước. Bơi lên để hồi oxy.'}else if(snap.phase==='quan')hint='E ở bếp: nấu / bưng món. Mang món đến đúng bàn rồi nhấn E.';$('#hint').textContent=offline?'Mất kết nối máy chủ.':hint;warnings();showModal()}
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error();snap=await r.json();offline=false;hud()}catch{offline=true;$('#hint').textContent='Mất kết nối máy chủ.'}setTimeout(poll,80)}
function txt(t,x,y,color='#f9f3df',align='center'){ctx.font='18px system-ui,sans-serif';ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){requestAnimationFrame(draw);const rect=cv.getBoundingClientRect(),dpr=devicePixelRatio||1,w=rect.width,h=rect.height;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0b222b';ctx.fillRect(0,0,w,h);if(!snap)return;const g=snap.phase==='gather';
 if(g){const b=snap.meta.bounds,s=Math.min((w-40)/(b.x[1]+4),(h-60)/(b.d[1]+5)),ox=(w-b.x[1]*s)/2,oy=48,X=x=>ox+x*s,Y=d=>oy+d*s;ctx.fillStyle='#c6ded9';ctx.fillRect(X(0),10,b.x[1]*s,38);const grad=ctx.createLinearGradient(0,oy,0,Y(b.d[1]));grad.addColorStop(0,'#3caaac');grad.addColorStop(1,'#0a354c');ctx.fillStyle=grad;ctx.fillRect(X(0),oy,b.x[1]*s,b.d[1]*s);for(let d=10;d<=30;d+=10){ctx.strokeStyle='#ffffff26';ctx.beginPath();ctx.moveTo(X(0),Y(d));ctx.lineTo(X(100),Y(d));ctx.stroke();txt(d+'m',X(1),Y(d)-6,'#bad9df','left')}ctx.fillStyle='#8b5935';ctx.fillRect(X(0),oy-12,6*s,15);txt('Bến',X(3),oy-20,'#264647');for(const n of snap.nodes){ctx.globalAlpha=n.ready?1:.3;ctx.fillStyle=colors[n.kind];ctx.beginPath();ctx.ellipse(X(n.pos[0]),Y(0),10,5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;txt(n.id,X(n.pos[0]),oy-13,'#264647')}for(const f of snap.fish){ctx.save();ctx.translate(X(f.pos[0]),Y(f.pos[1]));ctx.rotate(f.heading_deg*Math.PI/180);ctx.fillStyle=colors[f.kind];ctx.beginPath();ctx.ellipse(0,0,11,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-17,-6);ctx.lineTo(-17,6);ctx.fill();ctx.restore()}for(const m of snap.monsters||[]){ctx.fillStyle=m.state==='recoil'?'#bf8f96':'#62866b';ctx.fillRect(X(m.pos[0])-19,Y(m.pos[1])-8,38,16);txt('Cá sấu',X(m.pos[0]),Y(m.pos[1])-14,'#f4d2c8')}const p=snap.player;circle(X(p.pos[0]),Y(p.pos[1]),9,p.invuln_ticks&&Math.floor(snap.tick/5)%2?'#ffffff80':'#f6a75b');ctx.strokeStyle='#ffecd6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(p.pos[0]),Y(p.pos[1]));ctx.lineTo(X(p.pos[0])+16*Math.cos(p.heading_deg*Math.PI/180),Y(p.pos[1])+16*Math.sin(p.heading_deg*Math.PI/180));ctx.stroke()}
 else if(snap.phase==='quan'){const s=Math.min((w-60)/16,(h-60)/10),ox=(w-16*s)/2,oy=(h-10*s)/2,X=x=>ox+x*s,Y=z=>oy+(10-z)*s;ctx.fillStyle='#bfa478';ctx.fillRect(X(0),Y(10),16*s,10*s);for(let x=0;x<=16;x+=2){ctx.strokeStyle='#977d5638';ctx.beginPath();ctx.moveTo(X(x),Y(0));ctx.lineTo(X(x),Y(10));ctx.stroke()}for(const st of snap.stoves){ctx.fillStyle={idle:'#52666a',cooking:'#d88b3e',ready:'#77a76c'}[st.state];ctx.fillRect(X(st.pos[0])-.65*s,Y(st.pos[1])-.65*s,1.3*s,1.3*s);txt(st.id,X(st.pos[0]),Y(st.pos[1])+5);txt(st.state==='cooking'?Math.ceil(st.cook_ticks_left/60)+'s':st.state==='ready'?'Chín · E':'Bếp · E',X(st.pos[0]),Y(st.pos[1])+s,'#263f3f')}for(const tb of snap.tables){circle(X(tb.pos[0]),Y(tb.pos[1]),.65*s,'#805837');txt(tb.id,X(tb.pos[0]),Y(tb.pos[1])+6);const c=snap.customers.find(c=>c.table_id===tb.id);if(c){circle(X(tb.pos[0]),Y(tb.pos[1])-s,12,c.state==='eating'?'#82b991':'#f0c9a3');txt(c.state==='eating'?'Đang ăn':Math.ceil(c.patience_ticks_left/60)+'s',X(tb.pos[0]),Y(tb.pos[1])-1.5*s,c.patience_ticks_left<900?'#9f2d25':'#263f3f')}}circle(X(snap.player.pos[0]),Y(snap.player.pos[1]),11,'#f4a65b');if(snap.hand)circle(X(snap.player.pos[0])+12,Y(snap.player.pos[1])-12,7,'#fff0b2')}
